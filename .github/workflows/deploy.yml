name: Build and deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MkDocs configuration
        uses: actions/checkout@v4

      - name: Checkout template-docs sources
        uses: actions/checkout@v4
        with:
          repository: tiogars/template-docs
          path: template-docs
          # Set DOCS_REPO_TOKEN if template-docs is private
          token: ${{ secrets.DOCS_REPO_TOKEN || github.token }}

      - name: Arrange files like the image expects (docs/mkdocs, docs/src)
        run: |
          mkdir -p docs site_output
          cp -r mkdocs docs/mkdocs
          cp -r template-docs/src docs/src

      - name: Build site with mkdocs-docker-image
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/docs:/server/docs:ro" \
            -v "$GITHUB_WORKSPACE/site_output:/server/site_output" \
            -w /server --user "$(id -u):$(id -g)" \
            ghcr.io/tiogars/mkdocs-docker-image:latest \
            build --config-file docs/mkdocs/mkdocs.yml

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site_output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
